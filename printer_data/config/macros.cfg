#####################################################################
#   A better print_start macro for v2/trident
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Nevermore (if you have one)
## Z_TILT_ADJUST (For Trident only)
## QUAD_GANTRY_LEVEL (For V2.4 only)
## Beacon Contact logic (if you have one. 4 lines at 4 locations)

# One slicer entry point. Keep the tested Pico and FilamAtrix macros included.
[gcode_macro PRINT_START]
description: Home, prepare bed, select filament, brush and prime
gcode:
    {% set target_bed = params.BED|float %}
    {% set target_extruder = params.EXTRUDER|float %}
    {% set target_chamber = params.CHAMBER|default(0)|float %}
    {% set lane = params.LANE|default(-1)|int %}
    {% set sp = printer["gcode_macro _SP_VARS"] %}
    {% set bed = printer["gcode_macro _BED"] %}
    {% set cutter = printer["gcode_macro _SP_TIP_FORM"] %}
    {% set x_wait = (bed.min_x|float + bed.max_x|float) / 2 %}
    {% set y_wait = (bed.min_y|float + bed.max_y|float) / 2 %}

    {% if sp.enabled|int != 1 %}
        {action_raise_error("PRINT_START requires Pico enabled")}
    {% endif %}
    {% if lane < 0 or lane >= sp.lanes|int %}
        {action_raise_error("PRINT_START requires a valid LANE")}
    {% endif %}
    {% if target_extruder < sp.min_loading_temp|float %}
        {action_raise_error("Requested nozzle temperature is below the cutter loading minimum")}
    {% endif %}
    {% if target_bed <= 0 %}
        {action_raise_error("PRINT_START requires BED greater than zero")}
    {% endif %}

    CLEAR_PAUSE
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=0
    SET_FAN_SPEED FAN=Nevermore SPEED=1
    SET_LED LED=chamber WHITE=0.05 SYNC=0 TRANSMIT=1
    SET_SKEW CLEAR=1
    BED_MESH_CLEAR
    G90
    M83

    # Start bed heating; keep the nozzle at Tap's probing temperature.
    M140 S{target_bed}
    STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Hotend: 150c"
    M109 S150
    STATUS_HOMING
    G28
    G90

    # Existing bed-mounted brush is used only before the object is printed.
    SET_DISPLAY_TEXT MSG="Cleaning nozzle"
    BRUSH_NOZZLE
    G0 X{x_wait} Y{y_wait} Z15 F9000

    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    STATUS_HEATING
    {% if target_bed > 90 %}
        M106 S255
    {% endif %}
    M190 S{target_bed}
    # CHAMBER remains accepted. Chamber waiting was disabled in the old start.
    # No new chamber wait or timed soak is introduced here.

    M109 S150
    SET_DISPLAY_TEXT MSG="Leveling"
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    G28 Z
    SKEW_PROFILE LOAD=default_skew

    SET_DISPLAY_TEXT MSG="Bed mesh"
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Heat and load at the tested cutter-clear location, above the ooze bucket.
    G90
    G0 Z15 F600
    G0 X{cutter.clear_x} F6000
    G0 Y{cutter.cut_y} F6000
    M107
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
    STATUS_HEATING
    M109 S{target_extruder}

    # Commands execute before the filament helper reads the resulting state.
    _SP_REFRESH_STATE
    SP_INIT
    _PRINT_START_FILAMENT LANE={lane} TEMP={target_extruder}
    _PRINT_START_FINISH LANE={lane} TEMP={target_extruder}


[gcode_macro _PRINT_START_FILAMENT]
description: Internal startup filament stage; do not call separately
gcode:
    {% set lane = params.LANE|int %}
    {% set temp = params.TEMP|float %}
    {% set sp = printer["gcode_macro _SP_VARS"] %}
    {% set rt = printer["gcode_macro _SP_VARS_RUNTIME"] %}
    {% set loaded = printer.save_variables.variables.last_loaded_lane|default(-1)|int %}
    {% set hotend_loaded = printer.save_variables.variables.hotend_loaded|default(0)|int %}
    {% set tool = printer["filament_switch_sensor tool"].filament_detected %}
    {% set hotend = printer["filament_switch_sensor hotend"].filament_detected %}
    {% set purge = sp.print_start_change_purge|float %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("PRINT_START filament stage reached without XYZ homed")}
    {% endif %}
    {% if rt.exit_code|int != 0 %}
        {action_raise_error("Pico initialization reported an error")}
    {% endif %}
    {% if loaded < 0 and (tool or hotend) %}
        {action_raise_error("Toolhead contains filament but Pico has no loaded lane; reconcile the lane before starting")}
    {% endif %}
    {% if loaded >= 0 and (not tool or not hotend) %}
        {action_raise_error("Loaded lane and toolhead sensors disagree; check the filament before cutting")}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_SP_VARS_RUNTIME VARIABLE=loading_lane VALUE={lane}
    SET_GCODE_VARIABLE MACRO=_SP_VARS_RUNTIME VARIABLE=unloading_lane VALUE={loaded}

    {% if loaded != lane or hotend_loaded != 1 %}
        SET_GCODE_VARIABLE MACRO=_SP_VARS_RUNTIME VARIABLE=print_start_change VALUE=1
        SET_GCODE_VARIABLE MACRO=_SP_VARS_RUNTIME VARIABLE=user_macros_executed VALUE=1
        RESPOND MSG="PRINT_START: Preparing lane {lane}"
        SAVE_GCODE_STATE NAME=PRINT_START_BEFORE_CHANGE
        _SP_BEFORE_CHANGE PRINT_START=1
        RESTORE_GCODE_STATE NAME=PRINT_START_BEFORE_CHANGE MOVE=0

        {% if loaded == lane %}
            # The correct lane is captured, but is parked rather than nozzle-loaded.
            _SP_LOAD_HOTEND TEMP={temp} PURGE={purge}
        {% else %}
            # Handles either an empty path or cutting/unloading a different lane.
            _SP_FILAMENT_CHANGE UNLOAD_LANE={loaded} LOAD_LANE={lane} TEMP={temp} PURGE={purge}
        {% endif %}
    {% else %}
        RESPOND MSG="PRINT_START: Lane {lane} already loaded"
    {% endif %}


[gcode_macro _PRINT_START_FINISH]
description: Internal startup verification, pre-print brush and prime
gcode:
    {% set lane = params.LANE|int %}
    {% set temp = params.TEMP|float %}
    {% set rt = printer["gcode_macro _SP_VARS_RUNTIME"] %}
    {% set loaded = printer.save_variables.variables.last_loaded_lane|default(-1)|int %}
    {% set hotend_loaded = printer.save_variables.variables.hotend_loaded|default(0)|int %}
    {% set hub = printer["filament_switch_sensor sp_sensor_runout"].filament_detected %}
    {% set tool = printer["filament_switch_sensor tool"].filament_detected %}
    {% set hotend = printer["filament_switch_sensor hotend"].filament_detected %}
    {% set bed = printer["gcode_macro _BED"] %}
    {% set brush = printer["gcode_macro BRUSH_NOZZLE"] %}
    {% set brush_clear_x = [brush.x1|float, brush.x2|float]|max + 5 %}
    {% set x_wait = (bed.min_x|float + bed.max_x|float) / 2 %}
    {% set y_wait = (bed.min_y|float + bed.max_y|float) / 2 %}

    {% if rt.exit_code|int != 0 or printer.pause_resume.is_paused %}
        {action_raise_error("Pico startup failed or paused; brush and prime cancelled")}
    {% endif %}
    {% if loaded != lane or hotend_loaded != 1 or not hub or not tool or not hotend %}
        {action_raise_error("Startup lane or sensor verification failed; brush and prime cancelled")}
    {% endif %}

    {% if rt.user_macros_executed|int == 1 %}
        SAVE_GCODE_STATE NAME=PRINT_START_AFTER_CHANGE
        _SP_AFTER_CHANGE PRINT_START=1
        RESTORE_GCODE_STATE NAME=PRINT_START_AFTER_CHANGE MOVE=0
    {% endif %}

    _SP_RESTORE_PA FORCE=1
    SET_GCODE_VARIABLE MACRO=_SP_VARS_RUNTIME VARIABLE=user_macros_executed VALUE=0
    SET_GCODE_VARIABLE MACRO=_SP_VARS_RUNTIME VARIABLE=fused VALUE=1
    SET_GCODE_VARIABLE MACRO=_SP_VARS_RUNTIME VARIABLE=next_purge VALUE=0
    SET_FILAMENT_SENSOR SENSOR=sp_sensor_runout ENABLE=1
    _SP_REFRESH_STATE

    # Never switch off the nozzle between loading and priming.
    M109 S{temp}
    G90
    M83
    M107
    SET_DISPLAY_TEXT MSG="Cleaning nozzle"
    # Approach from the bucket side with the requested 5 mm brush buffer.
    G0 Z15 F600
    G0 X{brush_clear_x} F6000
    G0 Y{brush.y1} F6000
    BRUSH_NOZZLE

    # Leave the brush at travel height before KAMP positions for its prime.
    G90
    G0 Z15 F600
    G0 X{brush_clear_x} F6000
    G0 X{x_wait} Y{y_wait} F9000
    M83
    G92 E0
    SET_DISPLAY_TEXT MSG="Priming"
    VORON_PURGE
    STATUS_PRINTING
    SET_DISPLAY_TEXT MSG="Printing"

[gcode_macro END_PRINT]
gcode:
##Get Boundaries
  {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set min_x = printer.configfile.config["stepper_x"]["position_endstop"]|float %}
  {% set min_y = printer.configfile.config["stepper_y"]["position_endstop"]|float %}

##Check end position to determine safe directions to move
  {% if printer.toolhead.position.x < (max_x - 20) %}
  {% set x_safe = 20.0 %}
  {% else %}
  {% set x_safe = -20.0 %}
  {% endif %}
  {% if printer.toolhead.position.y < (max_y - 20) %}
  {% set y_safe = 20.0 %}
  {% else %}
  {% set y_safe = -20.0 %}
  {% endif %}
  {% if printer.toolhead.position.z < (max_z - 2) %}
  {% set z_safe = 2.0 %}
  {% else %}
  {% set z_safe = max_z - printer.toolhead.position.z %}
  {% endif %}

##Commence PRINT_END
  M400 ; wait for buffer to clear
  G92 E0 ; zero the extruder
  G1 E-4.0 F3600 ; retract
  G91 ; relative positioning
  G0 Z{z_safe} F3600 #G0 Z10 F3600 ;  move nozzle up
  #G0 Z{z_safe} F3600 #G0 Z10 F3600 ;  move nozzle up
  M104 S0 ; turn off hotend
  M140 S0 ; turn off bed
  M106 S0 ; turn off fan
  M107 ; turn off part cooling fan
  G90 ; absolute positioning
  G1 X{max_x} Y{min_y} F2000 ; move nozzle and present
  # BRUSH_NOZZLE
  M84 X Y E ; Disable all steppers but Z
  SET_LED LED=chamber WHITE=0.00 SYNC=0 TRANSMIT=1 ; Turn off Chamber led

[gcode_macro _BED]
variable_min_x: 0.0
variable_max_x: 300.0
variable_min_y: 10.0
variable_max_y: 310.0
gcode:  
    
[gcode_macro LOAD_FILAMENT]
variable_load_distance:  100
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  150
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed} # purge
    G1 E-{unload_distance} F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state    

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

